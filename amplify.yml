version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify's console environment variables exist only inside THIS build
        # container. Server code (app/api/contact) reads them at request time,
        # inside the Lambda, where they are no longer present — which makes
        # app/_lib/supabase.ts throw and every inquiry return a 500.
        #
        # Writing them into .env.production bakes them into the deployed bundle
        # so Next.js can read them at runtime. If this line fails the build, the
        # variable names in the Amplify console do not match the names below.
        - env | grep -E '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY|RESEND_API_KEY|NEXT_PUBLIC_SITE_URL)=' >> .env.production
        # Print only the NAMES that were captured — never the values, since
        # build logs are readable by anyone with console access.
        - cut -d= -f1 .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
